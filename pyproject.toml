[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-apriltag-calibration"
version = "0.1.0"
description = "AprilTag camera calibration and multi-camera reconstruction tools for MuJoCo workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "absl-py==2.3.1",
    "contourpy==1.3.2",
    "cycler==0.12.1",
    "etils==1.13.0",
    "fonttools==4.61.1",
    "fsspec==2026.1.0",
    "glfw==2.10.0",
    "importlib-resources==6.5.2",
    "kiwisolver==1.4.9",
    "matplotlib==3.10.8",
    "mujoco==3.4.0",
    "mujoco-py>=2.1.2.14",
    "numpy==2.2.6",
    "opencv-python==4.13.0.90",
    "packaging==26.0",
    "pillow==12.1.0",
    "pupil-apriltags==1.0.4.post11",
    "pyopengl==3.1.10",
    "pyparsing==3.3.2",
    "pyserial>=3.5",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    "typing-extensions==4.15.0",
    "zipp==3.23.0",
]

[project.scripts]
view-camera-location-calibrated = "mujoco_apriltag_calibration.view_camera_location_calibrated:main"
view-camera-location = "mujoco_apriltag_calibration.view_camera_location:main"
jenga-controller = "mujoco_apriltag_calibration.jenga_controller:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mujoco_apriltag_calibration = [
    "assets/*.xml",
    "assets/*.obj",
    "assets/textures/textures/*.png",
]
